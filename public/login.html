<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Traccar Fleet Simulator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-sky-500 selection:text-white">

  <!-- Glows decorativos de fundo -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Card Central de Login -->
  <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl shadow-black/60 p-6 sm:p-8 z-10 transition-all">
    
    <!-- Header do Card -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-xl shadow-sky-500/20 mb-3 border border-sky-400/30">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
        </svg>
      </div>

      <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 mb-2">
        <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
        Área Administrativa Restrita
      </div>

      <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Traccar Simulator</h1>
      <p class="text-xs text-slate-400 mt-1">Informe suas credenciais administrativas para acessar o painel de simulação.</p>
    </div>

    <!-- Mensagem de Alerta / Erro -->
    <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-start gap-2.5">
      <svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <span id="alertMessage" class="leading-relaxed">Usuário ou senha incorretos.</span>
    </div>

    <!-- Formulário de Login -->
    <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
      <div>
        <label for="loginInput" class="block text-xs font-medium text-slate-300 mb-1.5">Usuário ou E-mail</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <input 
            type="text" 
            id="loginInput" 
            name="login" 
            required 
            autofocus 
            placeholder="Ex: admin"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all font-mono"
          />
        </div>
      </div>

      <div>
        <label for="passwordInput" class="block text-xs font-medium text-slate-300 mb-1.5">Senha de Acesso</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <input 
            type="password" 
            id="passwordInput" 
            name="password" 
            required 
            placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-10 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all font-mono"
          />
          <button 
            type="button" 
            onclick="togglePasswordVisibility()" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300 transition-colors"
            title="Mostrar ou ocultar senha"
          >
            <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" id="rememberInput" checked class="w-4 h-4 rounded border-slate-800 bg-slate-950 text-sky-500 focus:ring-sky-500/40 focus:ring-offset-0 focus:ring-1">
          <span class="text-xs text-slate-400 hover:text-slate-300 transition-colors">Lembrar neste navegador</span>
        </label>
      </div>

      <button 
        type="submit" 
        id="btnSubmit" 
        class="w-full bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-medium text-sm py-2.5 px-4 rounded-xl shadow-lg shadow-sky-600/25 flex items-center justify-center gap-2 transition-all active:scale-[0.99] cursor-pointer"
      >
        <span id="btnSubmitText">Entrar no Painel</span>
        <svg id="btnSubmitIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>
    </form>

    <!-- Rodapé explicativo -->
    <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
      <p class="text-[11px] text-slate-500 leading-relaxed">
        Usuário e senha são configurados nas variáveis de ambiente
        <code class="px-1 py-0.5 rounded bg-slate-950 text-sky-400 font-mono text-[10px] border border-slate-800">ADMIN_USER</code> e
        <code class="px-1 py-0.5 rounded bg-slate-950 text-sky-400 font-mono text-[10px] border border-slate-800">ADMIN_PASSWORD</code>
        do arquivo <code class="px-1 py-0.5 rounded bg-slate-950 text-slate-300 font-mono text-[10px] border border-slate-800">.env</code>.
      </p>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pass = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (pass.type === 'password') {
        pass.type = 'text';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>';
      } else {
        pass.type = 'password';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
      }
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const login = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const remember = document.getElementById('rememberInput').checked;
      const alertBox = document.getElementById('alertBox');
      const alertMessage = document.getElementById('alertMessage');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnSubmitText = document.getElementById('btnSubmitText');
      const btnSubmitIcon = document.getElementById('btnSubmitIcon');

      alertBox.classList.add('hidden');
      alertBox.classList.remove('shake');
      btnSubmit.disabled = true;
      btnSubmit.classList.add('opacity-70', 'cursor-not-allowed');
      btnSubmitText.textContent = 'Autenticando...';
      btnSubmitIcon.classList.add('animate-spin');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ login, password, remember })
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok && data.success) {
          if (data.token) {
            localStorage.setItem('traccar_sim_token', data.token);
          }
          if (data.user && data.user.name) {
            localStorage.setItem('traccar_sim_admin_user', data.user.name);
          }
          btnSubmitText.textContent = 'Acesso liberado! Entrando...';
          btnSubmit.classList.remove('from-sky-600', 'to-indigo-600');
          btnSubmit.classList.add('from-emerald-600', 'to-teal-600');
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 400);
        } else {
          const msg = data.message || 'Credenciais inválidas. Verifique o usuário e senha.';
          alertMessage.textContent = msg;
          alertBox.classList.remove('hidden');
          alertBox.classList.add('shake');
          document.getElementById('passwordInput').select();

          btnSubmit.disabled = false;
          btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
          btnSubmitText.textContent = 'Entrar no Painel';
          btnSubmitIcon.classList.remove('animate-spin');
        }
      } catch (err) {
        console.error('Erro na requisição de login:', err);
        alertMessage.textContent = 'Erro de comunicação com o servidor do simulador.';
        alertBox.classList.remove('hidden');
        alertBox.classList.add('shake');

        btnSubmit.disabled = false;
        btnSubmit.classList.remove('opacity-70', 'cursor-not-allowed');
        btnSubmitText.textContent = 'Entrar no Painel';
        btnSubmitIcon.classList.remove('animate-spin');
      }
    }
  </script>
</body>
</html>
